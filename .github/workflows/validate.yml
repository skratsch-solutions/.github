name: Validate shared governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check actions/solo-review/review-readiness.mjs
      - run: node --test actions/solo-review/review-readiness.test.mjs
